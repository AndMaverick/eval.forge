[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval.forge"
version = "0.1.0"
description = "A small evaluation harness: scorers, suites, crash-safe runs, and a regression gate for model and prompt changes. Dependency-free Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["eval_forge*"]
